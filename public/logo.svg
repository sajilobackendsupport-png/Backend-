<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <linearGradient id="slateGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="orangeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#ea580c" />
    </linearGradient>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="96" fill="url(#slateGrad)" stroke="rgba(255,255,255,0.05)" stroke-width="4" />

  <!-- A dynamic outer ring in orange to signify motion -->
  <path d="M100 20 A 80 80 0 0 1 180 100" fill="none" stroke="url(#orangeGrad)" stroke-width="8" stroke-linecap="round" />
  
  <!-- Steering Wheel -->
  <circle cx="100" cy="100" r="55" fill="none" stroke="#ffffff" stroke-width="10" />
  
  <path d="M100 100 L50 82 M100 100 L150 82 M100 100 L100 155" stroke="#ffffff" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" />
  
  <!-- Orange Center Horn/Cap -->
  <circle cx="100" cy="100" r="22" fill="url(#orangeGrad)" />
  
  <!-- Modern Checkmark passing through the center representing 'Pass Easy' -->
  <path d="M88 102 L98 112 L120 85" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
</svg>
